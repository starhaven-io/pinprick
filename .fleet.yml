schema: 1
visibility: "public"
license: "agpl"
params:
  codecov: true
  conclusion:
    workflow: ".github/workflows/ci.yml"
    audit-jobs: ["pinprick"]
    pinprick-jobs: ["pinprick"]
  astro-docs: true
  renovate: true
  dependabot:
    - package-ecosystem: "cargo"
      group: "cargo-dependencies"
      directory: "/"
      allow:
        - dependency-type: "all"
    - package-ecosystem: "github-actions"
      group: "github-actions"
      directory: "/"
    - package-ecosystem: "npm"
      group: "npm-dependencies"
      directory: "/site"
  npm-policy:
    projects: ["site"]
  link-check:
    targets: "--config lychee.toml --root-dir site/dist/client './site/dist/client/**/*.html' README.md"
    build-site: true
    site-directory: "site"
    authenticated-github: false
    schedule: "0 14 * * 1"
    concurrency-group: "link-check"
  codeql:
    languages: ["actions", "rust"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/rust-toolchain*"
      - "**/rust-project.json"
      - "**/.cargo/**"
      - "audited-actions/**"
      - "catalog-minisign.pub"
      - ".github/workflows/**"
    runner: "ubuntu-24.04"
    timeout-minutes: 30
    build-mode: "none"
  readme:
    badges:
      workflow: "ci.yml"
      extra: []
    license: {}
exceptions:
  pinprick-audit: "build-from-source: audits the local checkout"
  pinprick-audit-recipe: "build-from-source: audits the local checkout"
