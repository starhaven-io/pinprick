version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      "cargo-dependencies":
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "starhaven-io/*"
    ignore:
      # Fleet pins are owned by the sync; Dependabot never writes them.
      - dependency-name: "starhaven-io/.github/*"
    groups:
      "github-actions":
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      "npm-dependencies":
        patterns:
          - "*"
