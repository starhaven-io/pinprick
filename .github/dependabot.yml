version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      "cargo-dependencies":
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "starhaven-io/*"
        # A new Ruby is unusable until setup-ruby knows it exists, so a
        # cooldown here delays every Ruby bump for no safety.
        - "ruby/setup-ruby"
    ignore:
      # Fleet pins are owned by the sync; Dependabot never writes them.
      - dependency-name: "starhaven-io/.github/*"
      # pinprick's source scan does not yet cover setup-node v7; reassess when it does
      - dependency-name: "actions/setup-node"
        versions:
          - ">=7.0.0"
    groups:
      "github-actions":
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      "npm-dependencies":
        patterns:
          - "*"
