version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      "cargo-dependencies":
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "starhaven-io/*"
        # A new Ruby is unusable until setup-ruby knows it exists, so a
        # cooldown here delays every Ruby bump for no safety.
        - "ruby/setup-ruby"
    ignore:
      # Fleet pins are owned by the sync; Dependabot never writes them.
      - dependency-name: "starhaven-io/.github/*"
    groups:
      "github-actions":
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      # Wrangler 4.111.0 rejects the legacy_env field emitted by the Astro/Cloudflare adapter's generated config; reassess when the adapter fix is usable
      - dependency-name: "wrangler"
        versions:
          - ">=4.111.0"
    groups:
      "npm-dependencies":
        patterns:
          - "*"
