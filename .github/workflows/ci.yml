name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_codecov: ${{ steps.matrix.outputs.run_codecov }}
      run_pinprick: ${{ steps.matrix.outputs.run_pinprick }}
      run_zizmor: ${{ steps.matrix.outputs.run_zizmor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: run lint to warm the cache, and Coverage so
          # Codecov has a baseline for PR comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo 'matrix=[{"name":"Lint","check":"lint","runner":"ubuntu-24.04","fetch_depth":1},{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04","fetch_depth":1}]' >> "${GITHUB_OUTPUT}"
            echo "run_pinprick=false" >> "${GITHUB_OUTPUT}"
            echo "run_zizmor=false" >> "${GITHUB_OUTPUT}"
            echo "run_codecov=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MATRIX='[]'
          add_check() {
            local entry="$1"
            if [[ "${MATRIX}" == "[]" ]]; then
              MATRIX="[${entry}]"
            else
              MATRIX="${MATRIX%]},${entry}]"
            fi
          }
          RUN_ZIZMOR=false
          RUN_PINPRICK=false

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, coverage, site checks and the rest.
          CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD")

          # Rust or build workflow changes: lint + test + MSRV
          if echo "${CHANGED}" | grep -qE '\.rs$|^Cargo\.(toml|lock)$|^build\.rs$|^deny\.toml$|^justfile$|^rust-toolchain\.toml$|^clippy\.toml$|^rustfmt\.toml$|^\.config/|^\.githooks/|^scripts/|^\.github/workflows/(ci|cargo-deny|release)\.yml$'; then
            add_check '{"name":"Lint","check":"lint","runner":"ubuntu-24.04","fetch_depth":1}'
            add_check '{"name":"Test (Linux)","check":"test","runner":"ubuntu-24.04","fetch_depth":1}'
            add_check '{"name":"Test (Linux ARM)","check":"test","runner":"ubuntu-24.04-arm","fetch_depth":1}'
            add_check '{"name":"Test (macOS)","check":"test","runner":"macos-26","fetch_depth":1}'
            add_check '{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04","fetch_depth":1}'
            add_check '{"name":"MSRV","check":"msrv","runner":"ubuntu-24.04","fetch_depth":1}'
          fi

          # Catalog edits: fully verify the changed catalog files. Detection-
          # rule changes (src/, deps, the verify script) re-verify the latest
          # entry of every catalog file: bundled clean verdicts suppress
          # scanning for users, so they must hold against the rules that ship
          # with them. The scheduled verify-audited-actions.yml walks the full
          # history in shards.
          VERIFY_CHANGED=false
          VERIFY_LATEST=false
          if echo "${CHANGED}" | grep -qE '^audited-actions/.+\.json$'; then
            VERIFY_CHANGED=true
          fi
          if echo "${CHANGED}" | grep -qE '^src/|^build\.rs$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^scripts/(verify-audited-actions\.sh|normalize-audit-json\.py)$'; then
            VERIFY_LATEST=true
          fi
          if [[ "${VERIFY_CHANGED}" == "true" || "${VERIFY_LATEST}" == "true" ]]; then
            add_check "{\"name\":\"Verify Audited Actions\",\"check\":\"verify-audited\",\"runner\":\"ubuntu-24.04\",\"fetch_depth\":0,\"verify_changed\":${VERIFY_CHANGED},\"verify_latest\":${VERIFY_LATEST}}"
          fi

          # Site or audited-actions changes: format check + build
          if echo "${CHANGED}" | grep -qE '^site/|^audited-actions/|^catalog-minisign\.pub$|^Cargo\.toml$|^\.github/workflows/deploy-site\.yml$'; then
            add_check '{"name":"Site","check":"site","runner":"ubuntu-slim","fetch_depth":1}'
          fi

          # Workflow changes: Actions security audit
          if echo "${CHANGED}" | grep -qE '^\.github/workflows/'; then
            RUN_ZIZMOR=true
          fi
          if echo "${CHANGED}" | grep -qE '^src/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.github/workflows/'; then
            RUN_PINPRICK=true
          fi

          # Fail safe for unclassified project inputs. Documentation-only
          # changes may skip the expensive matrix; every other unknown path
          # gets the full Rust gate instead of silently receiving no tests.
          if [[ "${MATRIX}" == "[]" ]] && echo "${CHANGED}" | grep -qvE '(^|/)(README|CHANGELOG|CONTRIBUTING|SECURITY)(\.[^/]*)?$|^docs/|\.md$|^LICENSE$'; then
            add_check '{"name":"Lint","check":"lint","runner":"ubuntu-24.04","fetch_depth":1}'
            add_check '{"name":"Test (Linux)","check":"test","runner":"ubuntu-24.04","fetch_depth":1}'
            add_check '{"name":"Test (Linux ARM)","check":"test","runner":"ubuntu-24.04-arm","fetch_depth":1}'
            add_check '{"name":"Test (macOS)","check":"test","runner":"macos-26","fetch_depth":1}'
            add_check '{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04","fetch_depth":1}'
            add_check '{"name":"MSRV","check":"msrv","runner":"ubuntu-24.04","fetch_depth":1}'
          fi

          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "run_pinprick=${RUN_PINPRICK}" >> "${GITHUB_OUTPUT}"
          echo "run_zizmor=${RUN_ZIZMOR}" >> "${GITHUB_OUTPUT}"
          echo "run_codecov=$(jq -r 'any(.[]; .check == "coverage")' <<<"${MATRIX}")" >> "${GITHUB_OUTPUT}"

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@a2ff1457a008d2fe895f044330469e38d6d97a6d # v2026.09.10.3

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `|| 1` default: GitHub expressions treat 0 as falsy, so a
          # full-history request would be silently rewritten to a shallow
          # clone and base-relative diffs would fail. Every matrix entry
          # sets its own depth instead.
          fetch-depth: ${{ matrix.fetch_depth }}
          persist-credentials: false


      - name: Test workflow tooling
        if: matrix.check == 'lint' || matrix.check == 'site'
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Restore cargo build cache
        id: cargo-build-cache
        if: matrix.check == 'lint' || matrix.check == 'test' || matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Restore coverage tools cache
        id: cov-tools-cache
        if: matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-

      - name: Restore lint tools cache
        id: lint-tools-cache
        if: matrix.check == 'lint'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-

      - name: Install typos-cli
        if: matrix.check == 'lint'
        run: cargo install typos-cli --locked --version 1.50.1

      - name: Install cargo-deny
        if: matrix.check == 'lint'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Clippy
        if: matrix.check == 'lint'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustfmt
        if: matrix.check == 'lint'
        run: cargo fmt -- --check

      - name: Typos
        if: matrix.check == 'lint'
        run: typos

      - name: Cargo deny
        if: matrix.check == 'lint'
        run: cargo deny check

      - name: Save cargo build cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.cargo-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save lint tools cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.lint-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}


      - name: Test
        if: matrix.check == 'test'
        run: cargo test --locked


      - name: Install MSRV toolchain
        if: matrix.check == 'msrv'
        run: |
          # The declared rust-version is only a promise if something builds
          # with it — the other legs use the current toolchain pinned by the repo.
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "${MSRV}" --profile minimal
          echo "MSRV=${MSRV}" >> "${GITHUB_ENV}"

      - name: Check with MSRV toolchain
        if: matrix.check == 'msrv'
        run: cargo "+${MSRV}" check --locked --all-targets


      - name: Add llvm-tools
        if: matrix.check == 'coverage'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-nextest
        if: matrix.check == 'coverage'
        run: cargo install cargo-nextest --locked --version 0.9.143

      - name: Install cargo-llvm-cov
        if: matrix.check == 'coverage'
        run: cargo install cargo-llvm-cov --locked --version 0.9.0

      - name: Run tests with coverage
        id: coverage-tests
        if: matrix.check == 'coverage'
        run: cargo llvm-cov nextest --profile ci --lcov --output-path lcov.info

      - name: Normalize report paths
        if: ${{ !cancelled() && matrix.check == 'coverage' }}
        env:
          TEST_RESULT: ${{ steps.coverage-tests.outcome }}
        run: |
          reports=(--junit target/nextest/ci/junit.xml)
          if [[ -f lcov.info || "${TEST_RESULT}" != failure ]]; then
            reports+=(--coverage lcov.info)
          fi
          python3 -I scripts/upload-codecov.py --prepare "${reports[@]}"

      - name: Save coverage reports
        if: ${{ !cancelled() && matrix.check == 'coverage' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            lcov.info
            target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 1

      - name: Save coverage tools cache
        if: matrix.check == 'coverage' && github.event_name == 'push' && steps.cov-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}


      - name: Setup Node
        if: matrix.check == 'site'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check npm install-script policy
        if: matrix.check == 'site'
        run: node scripts/check-npm-install-policy.mjs site

      - name: Install site dependencies
        if: matrix.check == 'site'
        working-directory: site
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Check formatting
        if: matrix.check == 'site'
        working-directory: site
        run: npm run format:check

      - name: Build site
        if: matrix.check == 'site'
        working-directory: site
        run: npm run build

      - name: Deploy dry-run
        if: matrix.check == 'site'
        working-directory: site
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: "false"


      - name: Check sort order
        if: matrix.check == 'verify-audited'
        run: |
          FAILED=0
          while IFS= read -r -d '' JSON_FILE; do
            if ! jq -e '
              type == "array" and
              all(.[];
                type == "object" and
                keys_unsorted == ["sha", "tag", "rules_version"] and
                (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.tag | type == "string") and
                (.rules_version |
                  type == "number" and . >= 1 and . <= 4294967295 and . == floor))
            ' "${JSON_FILE}" > /dev/null; then
              echo "::error::${JSON_FILE} has a non-canonical or unstamped entry"
              FAILED=1
              continue
            fi
            SORTED=$(jq 'sort_by([(.tag | ltrimstr("v") | split(".") | map(tonumber? // 0)), .tag]) | reverse' "${JSON_FILE}")
            ACTUAL=$(jq '.' "${JSON_FILE}")
            if [[ "${SORTED}" != "${ACTUAL}" ]]; then
              echo "::error::${JSON_FILE} is not sorted by version"
              FAILED=1
            fi
          done < <(find audited-actions -type f -name '*.json' -print0)
          exit "${FAILED}"

      - name: Build pinprick
        if: matrix.check == 'verify-audited'
        run: cargo build --locked --release

      - name: Verify audited-actions entries
        if: matrix.check == 'verify-audited'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFY_CHANGED: ${{ matrix.verify_changed }}
          VERIFY_LATEST: ${{ matrix.verify_latest }}
        run: |
          FAILED=0
          if [[ "${VERIFY_CHANGED}" == "true" ]]; then
            # Three outcomes must stay distinct. A failed diff means
            # verification did not happen and has to fail closed; folding it
            # into `|| true` let a shallow checkout skip catalog verification
            # and still report success. A change that only deletes catalog
            # files has nothing left to scan and is how a verdict is revoked.
            # An empty result with no deletions means this selection and
            # generate-matrix's disagree.
            DIFF_OK=1
            CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD" -- audited-actions/) || DIFF_OK=0
            PRESENT=$(git diff --name-only --diff-filter=d "${BASE_SHA}...HEAD" -- audited-actions/) || DIFF_OK=0
            if [[ "${DIFF_OK}" -eq 0 ]]; then
              echo "::error::could not diff audited-actions against ${BASE_SHA}; changed entries NOT verified"
              FAILED=1
            else
              readarray -t CHANGED_FILES < <(grep -E '\.json$' <<< "${CHANGED}" || true)
              readarray -t CATALOG_FILES < <(grep -E '\.json$' <<< "${PRESENT}" || true)
              if [[ ${#CATALOG_FILES[@]} -gt 0 ]]; then
                scripts/verify-audited-actions.sh target/release/pinprick files "${CATALOG_FILES[@]}" || FAILED=1
              elif [[ ${#CHANGED_FILES[@]} -gt 0 ]]; then
                echo "Catalog change only removes entries; no surviving files to re-verify."
              else
                echo "::error::catalog changes were detected but no catalog files resolved; changed entries NOT verified"
                FAILED=1
              fi
            fi
          fi
          if [[ "${VERIFY_LATEST}" == "true" ]]; then
            scripts/verify-audited-actions.sh target/release/pinprick latest || FAILED=1
          fi
          exit "${FAILED}"

  codecov:
    name: Codecov
    needs: [generate-matrix, check]
    # Forks still run coverage tests; Codecov OIDC accepts same-repository runs.
    if: ${{ !cancelled() && needs.generate-matrix.outputs.run_codecov == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Authenticate report uploads to Codecov with GitHub OIDC.
    steps:
      - name: Check out the trusted uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/upload-codecov.py
          sparse-checkout-cone-mode: false
          path: codecov-uploader

      - name: Download coverage-reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          path: reports

      - name: Upload reports with verified Codecov CLI
        env:
          TEST_RESULT: ${{ needs.check.result }}
        run: |
          reports=(--junit reports/target/nextest/ci/junit.xml)
          if [[ -f reports/lcov.info || "${TEST_RESULT}" != failure ]]; then
            reports+=(--coverage reports/lcov.info)
          fi
          python3 -I codecov-uploader/scripts/upload-codecov.py "${reports[@]}"

  zizmor:
    name: zizmor
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@a2ff1457a008d2fe895f044330469e38d6d97a6d # v2026.09.10.3

  pinprick:
    name: pinprick
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_pinprick == 'true'
    permissions:
      contents: read
      security-events: write # required for SARIF upload on same-repository changes
    # Temporary trade-off: gate with the released engine until the fleet-pinned
    # scanner can follow a local reusable-workflow call. Restore PR-time
    # build-from-source dogfooding when that support is delivered.
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@a2ff1457a008d2fe895f044330469e38d6d97a6d # v2026.09.10.3
    with:
      advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-findings: true

  conclusion:
    name: conclusion
    needs: [generate-matrix, commits, check, zizmor, pinprick, codecov]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          CODECOV_ELIGIBLE: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          RUN_CODECOV: ${{ needs.generate-matrix.outputs.run_codecov }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
          COMMITS_RESULT: ${{ needs.commits.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
          RUN_ZIZMOR: ${{ needs.generate-matrix.outputs.run_zizmor }}
          RUN_PINPRICK: ${{ needs.generate-matrix.outputs.run_pinprick }}
          EVENT_NAME: ${{ github.event_name }}
          MATRIX_RESULT: ${{ needs.generate-matrix.result }}
        run: |
          require_result() {
            local name="$1" result="$2" required="$3"
            case "${required}" in
              true) test "${result}" = success ;;
              false) test "${result}" = skipped ;;
              *) echo "::error::Invalid routing decision for ${name}."; return 1 ;;
            esac || { echo "::error::${name} ended with ${result:-no result}."; return 1; }
          }

          test "${MATRIX_RESULT}" = "success"
          case "${EVENT_NAME}" in
            pull_request) require_result commits "${COMMITS_RESULT}" true ;;
            push) require_result commits "${COMMITS_RESULT}" false ;;
            *) echo "::error::Unexpected CI event."; exit 1 ;;
          esac
          if [[ "${MATRIX}" == "[]" ]]; then
            require_result check "${CHECK_RESULT}" false
          elif [[ -n "${MATRIX}" ]]; then
            require_result check "${CHECK_RESULT}" true
          else
            echo "::error::The check matrix could not be determined."
            exit 1
          fi
          require_result zizmor "${ZIZMOR_RESULT}" "${RUN_ZIZMOR}"
          require_result pinprick "${PINPRICK_RESULT}" "${RUN_PINPRICK}"
          case "${RUN_CODECOV}:${CODECOV_ELIGIBLE}" in
            true:true) CODECOV_REQUIRED=true ;;
            true:false | false:true | false:false) CODECOV_REQUIRED=false ;;
            *) echo "::error::Invalid Codecov routing decision."; exit 1 ;;
          esac
          require_result codecov "${CODECOV_RESULT}" "${CODECOV_REQUIRED}"
