name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_zizmor: ${{ steps.matrix.outputs.run_zizmor }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: run lint to warm the cache, and Coverage so
          # Codecov has a baseline for PR comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo 'matrix=[{"name":"Lint","check":"lint","runner":"ubuntu-24.04"},{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04","environment":"codecov"}]' >> "${GITHUB_OUTPUT}"
            echo "run_zizmor=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MATRIX='[]'
          add_check() {
            local entry="$1"
            if [[ "${MATRIX}" == "[]" ]]; then
              MATRIX="[${entry}]"
            else
              MATRIX="${MATRIX%]},${entry}]"
            fi
          }
          RUN_ZIZMOR=false

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, coverage, site checks and the rest.
          CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD")

          # Rust or build workflow changes: lint + test + MSRV
          if echo "${CHANGED}" | grep -qE '\.rs$|^Cargo\.(toml|lock)$|^clippy\.toml$|^rustfmt\.toml$|^\.github/workflows/(ci|release)\.yml$'; then
            add_check '{"name":"Lint","check":"lint","runner":"ubuntu-24.04"}'
            add_check '{"name":"Test (Linux)","check":"test","runner":"ubuntu-24.04"}'
            add_check '{"name":"Test (Linux ARM)","check":"test","runner":"ubuntu-24.04-arm"}'
            add_check '{"name":"Test (macOS)","check":"test","runner":"macos-26"}'
            add_check '{"name":"Coverage","check":"coverage","runner":"ubuntu-24.04","environment":"codecov"}'
            add_check '{"name":"MSRV","check":"msrv","runner":"ubuntu-24.04"}'
          fi

          # Audited-actions changes: verify all entries
          if echo "${CHANGED}" | grep -qE '^audited-actions/'; then
            add_check '{"name":"Verify Audited Actions","check":"verify-audited","runner":"ubuntu-24.04"}'
          fi

          # Site or audited-actions changes: format check + build
          if echo "${CHANGED}" | grep -qE '^site/|^audited-actions/'; then
            add_check '{"name":"Site","check":"site","runner":"ubuntu-slim"}'
          fi

          # Workflow changes: Actions security audit
          if echo "${CHANGED}" | grep -qE '^\.github/workflows/'; then
            RUN_ZIZMOR=true
          fi

          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "run_zizmor=${RUN_ZIZMOR}" >> "${GITHUB_OUTPUT}"

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@989b76e2b1ceaf3531da903e288e79929bd2f30e # v2026.07.05.10

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false


      - name: Restore cargo build cache
        id: cargo-build-cache
        if: matrix.check == 'lint' || matrix.check == 'test' || matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore coverage tools cache
        id: cov-tools-cache
        if: matrix.check == 'coverage'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-

      - name: Restore lint tools cache
        id: lint-tools-cache
        if: matrix.check == 'lint'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-


      - name: Add Clippy and Rustfmt
        if: matrix.check == 'lint'
        run: rustup component add clippy rustfmt

      - name: Install typos-cli
        if: matrix.check == 'lint'
        run: cargo install typos-cli --locked --version 1.48.0

      - name: Install cargo-deny
        if: matrix.check == 'lint'
        run: cargo install cargo-deny --locked --version 0.19.9

      - name: Clippy
        if: matrix.check == 'lint'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustfmt
        if: matrix.check == 'lint'
        run: cargo fmt -- --check

      - name: Typos
        if: matrix.check == 'lint'
        run: typos

      - name: Cargo deny
        if: matrix.check == 'lint'
        run: cargo deny check

      - name: Save cargo build cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.cargo-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}

      - name: Save lint tools cache
        if: matrix.check == 'lint' && github.event_name == 'push' && steps.lint-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/typos
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-tools-${{ hashFiles('.github/workflows/ci.yml') }}


      - name: Test
        if: matrix.check == 'test'
        run: cargo test --locked


      - name: Install MSRV toolchain
        if: matrix.check == 'msrv'
        run: |
          # The declared rust-version is only a promise if something builds
          # with it — the other legs all use the runner's latest stable.
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "${MSRV}" --profile minimal
          echo "MSRV=${MSRV}" >> "${GITHUB_ENV}"

      - name: Check with MSRV toolchain
        if: matrix.check == 'msrv'
        run: cargo "+${MSRV}" check --locked --all-targets


      - name: Add llvm-tools
        if: matrix.check == 'coverage'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-nextest
        if: matrix.check == 'coverage'
        run: cargo install cargo-nextest --locked --version 0.9.140

      - name: Install cargo-llvm-cov
        if: matrix.check == 'coverage'
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      - name: Run tests with coverage
        if: matrix.check == 'coverage'
        run: cargo llvm-cov nextest --profile ci --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.check == 'coverage' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.check == 'coverage' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          fail_ci_if_error: false
          report_type: test_results

      - name: Save coverage tools cache
        if: matrix.check == 'coverage' && github.event_name == 'push' && steps.cov-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-cov-tools-${{ hashFiles('.github/workflows/ci.yml') }}


      - name: Setup Node
        if: matrix.check == 'site'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install site dependencies
        if: matrix.check == 'site'
        working-directory: site
        # Fail closed on unreviewed install scripts (npm v12 default; see allowScripts in package.json).
        run: npm ci --strict-allow-scripts

      - name: Check formatting
        if: matrix.check == 'site'
        working-directory: site
        run: npm run format:check

      - name: Build site
        if: matrix.check == 'site'
        working-directory: site
        run: npm run build

      - name: Deploy dry-run
        if: matrix.check == 'site'
        working-directory: site
        run: npm run deploy:dry
        env:
          WRANGLER_SEND_METRICS: "false"


      - name: Check sort order
        if: matrix.check == 'verify-audited'
        run: |
          FAILED=0
          for JSON_FILE in audited-actions/*/*.json; do
            SORTED=$(jq 'sort_by([(.tag | ltrimstr("v") | split(".") | map(tonumber? // 0)), .tag]) | reverse' "${JSON_FILE}")
            ACTUAL=$(jq '.' "${JSON_FILE}")
            if [[ "${SORTED}" != "${ACTUAL}" ]]; then
              echo "::error::${JSON_FILE} is not sorted by version"
              FAILED=1
            fi
          done
          exit "${FAILED}"

      - name: Build pinprick
        if: matrix.check == 'verify-audited'
        run: cargo build --locked --release

      - name: Verify audited-actions entries
        if: matrix.check == 'verify-audited'
        run: |
          FAILED=0
          for JSON_FILE in audited-actions/*/*.json; do
            [[ "${JSON_FILE}" == *.json ]] || continue
            OWNER=$(basename "$(dirname "${JSON_FILE}")")
            REPO=$(basename "${JSON_FILE}" .json)
            echo "--- ${OWNER}/${REPO} ---"

            ENTRIES=$(jq -c '.[]' "${JSON_FILE}")
            while IFS= read -r ENTRY; do
              SHA=$(echo "${ENTRY}" | jq -r '.sha')
              TAG=$(echo "${ENTRY}" | jq -r '.tag')
              echo "  Verifying ${TAG} (${SHA:0:7})..."

              TMPDIR=$(mktemp -d)
              mkdir -p "${TMPDIR}/.github/workflows"
              cat > "${TMPDIR}/.github/workflows/test.yml" <<YAML
          name: test
          on: push
          jobs:
            test:
              runs-on: ubuntu-24.04
              steps:
                - uses: ${OWNER}/${REPO}@${SHA} # ${TAG}
          YAML

              if ! ./target/release/pinprick --json audit "${TMPDIR}" 2>/dev/null; then
                echo "::error::${OWNER}/${REPO}@${SHA} (${TAG}) has audit findings"
                FAILED=1
              fi
              rm -rf "${TMPDIR}"
            done <<< "${ENTRIES}"
          done
          exit "${FAILED}"

  zizmor:
    name: zizmor
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_zizmor == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: auditor

  conclusion:
    name: conclusion
    needs: [commits, check, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          test "${COMMITS_RESULT}" = "success" || test "${COMMITS_RESULT}" = "skipped"
          test "${CHECK_RESULT}" = "success" || test "${CHECK_RESULT}" = "skipped"
          [[ "${ZIZMOR_RESULT}" == "success" || "${ZIZMOR_RESULT}" == "skipped" ]]
