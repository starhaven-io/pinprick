name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**/*.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/rust-toolchain*"
      - "**/rust-project.json"
      - "**/.cargo/**"
      - "audited-actions/**"
      - "catalog-minisign.pub"
      - ".github/workflows/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@82f0f8e89eeac8a7465e230e6b89cad9dbad8685 # v2026.10.14.1
    with:
      languages: '["actions","rust","ruby"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: "none"
      build-profile: ""
