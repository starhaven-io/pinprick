name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@74aa5391c55e434b2d4ffb72e52c8f524bde8a02 # v2026.07.25.1
    with:
      languages: '["actions"]'
      runner: "ubuntu-slim"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""
