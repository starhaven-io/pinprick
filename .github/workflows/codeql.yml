name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/rust-toolchain*"
      - "**/rust-project.json"
      - "**/.cargo/**"
      - "audited-actions/**"
      - "catalog-minisign.pub"
      - ".github/workflows/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@85b63590380becacd87cf3cccf8c2d6ea8146fad # v2026.09.28.1
    with:
      languages: '["actions","rust"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: "none"
      build-profile: ""
