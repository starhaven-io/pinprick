name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@1f76a911b7f4fea29eca5983901fa203f38bd303 # v2026.07.27.1
    with:
      languages: '["actions"]'
      runner: "ubuntu-slim"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""
