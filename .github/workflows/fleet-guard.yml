name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@2addbf69b694a7efd3b673ac0c878c988275b71f # v2026.07.29.2
    with:
      repo-name: ${{ github.event.repository.name }}
