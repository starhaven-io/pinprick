name: Link Check

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@9ae49e472a3025f0d232077b6d7552f03a0ced1a # v2026.10.12.1
    with:
      args: "--config lychee.toml --root-dir site/dist/client './site/dist/client/**/*.html' README.md"
      build-site: true
      site-directory: "site"
      authenticated-github: false
