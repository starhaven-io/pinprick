name: Link Check

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2
    with:
      args: "--config lychee.toml --root-dir site/dist/client './site/dist/client/**/*.html' README.md"
      build-site: true
      site-directory: "site"
      authenticated-github: false
