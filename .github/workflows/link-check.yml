name: Link Check

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@a93cbf1e015e136ea9d2c19e427dfd5af82b7662 # v2026.08.19.1
    with:
      args: "--config lychee.toml --root-dir site/dist/client './site/dist/client/**/*.html' README.md"
      build-site: true
      site-directory: "site"
      authenticated-github: false
