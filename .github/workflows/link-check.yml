name: Link Check

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@74aa5391c55e434b2d4ffb72e52c8f524bde8a02 # v2026.07.25.1
    with:
      args: "--config lychee.toml --root-dir site/dist/client './site/dist/client/**/*.html' README.md"
      build-site: true
      site-directory: "site"
      authenticated-github: false
