name: pinprick audit

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0

concurrency:
  group: "pinprick-audit-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore cargo cache (debug)
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}

      - name: Build pinprick
        run: cargo build --locked

      - name: Run pinprick audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./target/debug/pinprick audit --sarif . > pinprick.sarif
          EXIT=$?
          echo "PINPRICK_AUDIT_EXIT=${EXIT}" >> "${GITHUB_ENV}"
          # 0 = clean, 1 = findings (still upload), 2+ = real error
          if [[ "${EXIT}" -gt 1 ]]; then
            echo "::error::pinprick audit errored with exit code ${EXIT}"
            exit "${EXIT}"
          fi

      - name: Upload SARIF
        if: always() && (env.PINPRICK_AUDIT_EXIT == '0' || env.PINPRICK_AUDIT_EXIT == '1')
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: pinprick.sarif
          category: pinprick

      - name: Fail on findings
        if: always() && env.PINPRICK_AUDIT_EXIT == '1'
        run: |
          echo "::error::pinprick audit found runtime fetch risks"
          exit 1
