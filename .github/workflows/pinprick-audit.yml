name: pinprick audit

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0

concurrency:
  group: "pinprick-audit-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cargo cache (debug)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build pinprick
        run: cargo build --locked

      - name: Run pinprick audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./target/debug/pinprick audit --sarif . > pinprick.sarif
          EXIT=$?
          echo "PINPRICK_AUDIT_EXIT=${EXIT}" >> "${GITHUB_ENV}"
          # 0 = clean, 1 = findings (still upload), 2+ = real error
          if [[ "${EXIT}" -gt 1 ]]; then
            echo "::error::pinprick audit errored with exit code ${EXIT}"
            exit "${EXIT}"
          fi

      - name: Upload SARIF
        if: always() && (env.PINPRICK_AUDIT_EXIT == '0' || env.PINPRICK_AUDIT_EXIT == '1')
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: pinprick.sarif
          category: pinprick

      - name: Fail on findings
        if: always() && env.PINPRICK_AUDIT_EXIT == '1'
        run: |
          echo "::error::pinprick audit found runtime fetch risks"
          exit 1
