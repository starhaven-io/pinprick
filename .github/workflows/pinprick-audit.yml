name: pinprick audit

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  push:
    branches:
      - main

concurrency:
  group: "pinprick-audit-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Restore cargo cache (debug)
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-

      - name: Build pinprick
        run: cargo build

      - name: Save cargo cache (debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}

      - name: Run pinprick audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./target/debug/pinprick audit --sarif . > pinprick.sarif
          EXIT=$?
          echo "PINPRICK_AUDIT_EXIT=${EXIT}" >> "${GITHUB_ENV}"
          # 0 = clean, 1 = findings (still upload), 2+ = real error
          if [[ "${EXIT}" -gt 1 ]]; then
            echo "::error::pinprick audit errored with exit code ${EXIT}"
            exit "${EXIT}"
          fi

      - name: Upload SARIF
        if: always() && (env.PINPRICK_AUDIT_EXIT == '0' || env.PINPRICK_AUDIT_EXIT == '1')
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: pinprick.sarif
          category: pinprick

      - name: Fail on findings
        if: always() && env.PINPRICK_AUDIT_EXIT == '1'
        run: |
          echo "::error::pinprick audit found runtime fetch risks"
          exit 1
