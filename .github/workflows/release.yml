name: Release

on:
  workflow_dispatch:

defaults:
  run:
    # No -x: this workflow handles signing/notarization secrets, generated
    # keychain passwords, and short-lived app tokens.
    shell: bash -euo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  preflight:
    name: Preflight
    # Releases come from main only — a dispatch from any other branch would
    # tag and publish whatever that branch contains. Guarding the entry job
    # skips the whole chain via `needs`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not extract version from Cargo.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      # Fail before the five build jobs spend their minutes: a forgotten
      # version bump previously surfaced only at tag creation, after every
      # binary was already built.
      - name: Fail if tag already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::Tag ${TAG} already exists — bump the version in Cargo.toml before dispatching a release"
            exit 1
          fi

      - name: Fail if version already on crates.io
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Piped to jq: a JSON API probe, not fetched code — pinprick's own
          # audit exempts this form.
          if curl -fsS -A "pinprick-release-preflight" \
            "https://crates.io/api/v1/crates/pinprick/${VERSION}" | jq -e .version > /dev/null; then
            echo "::error::pinprick ${VERSION} is already on crates.io — bump the version in Cargo.toml before dispatching a release"
            exit 1
          fi

      # A workflow_dispatch can fire while main is red; don't publish an
      # untested commit to crates.io and the release page.
      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    environment:
      name: release
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
            sign: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: write # required to generate build provenance attestations
      id-token: write # required to generate build provenance attestations
    env:
      TEMPORARY_KEYCHAIN_FILE: "pinprick_signing.keychain-db"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create and unlock temporary macOS keychain
        if: matrix.sign
        run: |
          # Keep xtrace disabled here: this password is generated at runtime and is not a registered secret.
          TEMPORARY_KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"
          echo "::add-mask::${TEMPORARY_KEYCHAIN_PASSWORD}"
          TEMPORARY_KEYCHAIN_PATH="${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          security create-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${TEMPORARY_KEYCHAIN_PATH}"
          security unlock-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"

      - name: Import certificate into keychain
        if: matrix.sign
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          echo -n "${DEVELOPER_ID_CERTIFICATE}" | base64 --decode --output="${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" \
            -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -t cert -f pkcs12 -A
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security list-keychain -d user -s "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"

      - name: Set up Rust target toolchain
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "${TARGET}"
          # aws-lc-sys (via rustls) compiles C through CMake, so musl needs a toolchain.
          if [[ "${TARGET}" == *-musl ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools cmake
          fi

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "${TARGET}"

      - name: Validate binary
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BINARY="target/${TARGET}/release/pinprick"
          "${BINARY}" --version
          # musl artifacts must be static — a dynamic-loader entry would break on Alpine.
          if [[ "${TARGET}" == *-musl ]]; then
            file "${BINARY}"
            if readelf -l "${BINARY}" | grep -q 'Requesting program interpreter'; then
              echo "::error::${TARGET} binary is not statically linked"
              exit 1
            fi
          fi

      - name: Codesign binary
        if: matrix.sign
        env:
          TARGET: ${{ matrix.target }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          codesign --sign "Developer ID Application: Patrick Linnane (${DEVELOPMENT_TEAM})" \
            --options runtime \
            "target/${TARGET}/release/pinprick"

      - name: Notarize binary
        if: matrix.sign
        env:
          TARGET: ${{ matrix.target }}
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          mkdir -p "${RUNNER_TEMP}/notarize-staging"
          cp "target/${TARGET}/release/pinprick" "${RUNNER_TEMP}/notarize-staging/"
          ditto -c -k "${RUNNER_TEMP}/notarize-staging" "${RUNNER_TEMP}/pinprick-notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/pinprick-notarize.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${DEVELOPMENT_TEAM}" \
            --password "${NOTARIZATION_PASSWORD}" \
            --wait

      - name: Clean up temporary keychain
        if: always() && matrix.sign
        run: |
          if [[ -f "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" ]]; then
            security delete-keychain "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          fi

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARTIFACT="pinprick-${VERSION}-${TARGET}"
          mkdir -p staging
          cp "target/${TARGET}/release/pinprick" staging/
          cp LICENSE staging/
          # Keep AppleDouble/xattr metadata out of the tarball. --no-mac-metadata
          # is a bsdtar-only flag (macOS); GNU tar on the Linux runners rejects it
          # and only needs --no-xattrs, so gate it on the runner OS.
          TAR_FLAGS=(--no-xattrs)
          if [ "${RUNNER_OS}" = "macOS" ]; then
            TAR_FLAGS+=(--no-mac-metadata)
          fi
          /usr/bin/tar "${TAR_FLAGS[@]}" -czf "${ARTIFACT}.tar.gz" -C staging .
          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      - name: Generate build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: "${{ env.ARTIFACT }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: "${{ env.ARTIFACT }}.tar.gz"

  release:
    name: Release
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write # required to create tags and GitHub releases
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not extract version from Cargo.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${COMMIT_SHA}"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo "${REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            artifacts/**/*.tar.gz
          gh release view "${TAG}" \
            --repo "${REPOSITORY}" \
            --json body \
            --jq '.body' > "${RUNNER_TEMP}/raw_notes.md"

      - name: Format release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/format-release-notes.py \
            "${RUNNER_TEMP}/raw_notes.md" "${TAG}" \
            > "${RUNNER_TEMP}/formatted_notes.md"
          gh release edit "${TAG}" \
            --repo "${REPOSITORY}" \
            --notes-file "${RUNNER_TEMP}/formatted_notes.md"

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token exchanged with crates.io
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify packageable
        run: cargo publish --locked --dry-run

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  bump-cask:
    name: Bump Homebrew cask
    needs: release
    runs-on: macos-26
    environment:
      name: release
      deployment: false
    permissions: {}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Mint bot token for tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Bump Homebrew cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.tap-token.outputs.token }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: |
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(GH_TOKEN="${HOMEBREW_GITHUB_API_TOKEN}" gh api "/users/${BOT_USER}" --jq .id)
          export HOMEBREW_GIT_NAME="${BOT_USER}"
          export HOMEBREW_GIT_EMAIL="${BOT_ID}+${BOT_USER}@users.noreply.github.com"
          brew tap starhaven-io/homebrew-tap
          brew bump-cask-pr --no-fork --version "${VERSION}" starhaven-io/tap/pinprick
